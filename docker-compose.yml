x-common-variables: &common-variables
  # Catalog Database Variables
  POSTGRES_CATALOG_DB: catalog_db
  POSTGRES_CATALOG_USER: catalog_user
  POSTGRES_CATALOG_PASSWORD: catalog_password
  POSTGRES_CATALOG_HOST_PORT: 5432
  CATALOG_DATABASE_URL: postgresql://catalog_user:catalog_password@postgres-catalog:5432/catalog_db
  CATALOG_PORT: 3000

  # Auth Database Variables
  POSTGRES_AUTH_DB: auth_db
  POSTGRES_AUTH_USER: auth_user
  POSTGRES_AUTH_PASSWORD: auth_password
  POSTGRES_AUTH_HOST_PORT: 5433
  AUTH_DATABASE_URL: postgresql://auth_user:auth_password@postgres-auth:5432/auth_db
  AUTH_PORT: 3001

  # Cart Database Variables
  POSTGRES_CART_DB: cart_db
  POSTGRES_CART_USER: cart_user
  POSTGRES_CART_PASSWORD: cart_password
  POSTGRES_CART_HOST_PORT: 5434
  CART_DATABASE_URL: postgresql://cart_user:cart_password@postgres-cart:5432/cart_db
  CART_PORT: 3002

  # Notification Database Variables
  POSTGRES_NOTIFICATION_DB: notification_db
  POSTGRES_NOTIFICATION_USER: notification_user
  POSTGRES_NOTIFICATION_PASSWORD: notification_password
  POSTGRES_NOTIFICATION_HOST_PORT: 5435
  NOTIFICATION_DATABASE_URL: postgresql://notification_user:notification_password@postgres-notification:5432/notification_db
  NOTIFICATION_PORT: 3003

  # PGAdmin Variables
  PGADMIN_DEFAULT_EMAIL: admin@admin.com
  PGADMIN_DEFAULT_PASSWORD: admin

services:
  # Base de datos del catálogo
  postgres-catalog:
    image: postgres:15-alpine
    container_name: postgres_catalog
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
    ports:
      - "5432:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos del auth
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos del carrito
  postgres-cart:
    image: postgres:15-alpine
    container_name: postgres_cart
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: cart_password
    ports:
      - "5434:5432"
    volumes:
      - cart_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart_user -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos de notificaciones
  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres_notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
    ports:
      - "5435:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # 🛍️ Microservicio de catálogo
  catalog:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: catalog_service
    environment:
      DATABASE_URL: postgresql://catalog_user:catalog_password@postgres-catalog:5432/catalog_db
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres-catalog:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./services/catalog-service/src:/app/src
      - ./services/catalog-service/prisma:/app/prisma

  # Microservicio de autenticación
  auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      DATABASE_URL: postgresql://auth_user:auth_password@postgres-auth:5432/auth_db
      JWT_SECRET: auth_password
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/prisma:/app/prisma

  # Microservicio de carrito
  cart:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cart_service
    environment:
      DATABASE_URL: postgresql://cart_user:cart_password@postgres-cart:5432/cart_db
      CART_DATABASE_URL: postgresql://cart_user:cart_password@postgres-cart:5432/cart_db
      JWT_SECRET: auth_password
      NODE_ENV: production
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres-cart:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./services/cart-service/src:/app/src
      - ./services/cart-service/prisma:/app/prisma

  # Microservicio de notificaciones
  notification:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      DATABASE_URL: postgresql://notification_user:notification_password@postgres-notification:5432/notification_db
      NOTIFICATION_DATABASE_URL: postgresql://notification_user:notification_password@postgres-notification:5432/notification_db
      JWT_SECRET: auth_password
      NODE_ENV: production
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres-notification:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./services/notification-service/src:/app/src
      - ./services/notification-service/prisma:/app/prisma

# Volúmenes para persistencia
volumes:
  catalog_data:
  auth_data:
  cart_data:
  notification_data:

# Red compartida entre servicios
networks:
  app-network:
    driver: bridge
